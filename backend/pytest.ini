[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
log_cli = true
log_cli_level = WARNING

[coverage:run]
source = app
omit =
    app/__init__.py
    app/models/__init__.py
    app/api/__init__.py
    app/core/__init__.py
    app/engines/__init__.py
    app/services/__init__.py

[coverage:report]
show_missing = true
skip_empty = true
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    except Exception:

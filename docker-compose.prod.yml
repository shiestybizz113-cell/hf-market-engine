# Production deployment for hf-market-engine Capital Command Center V2.
#
#   cp .env.example .env
#   # fill APP_DOMAIN + secrets + provider feeds
#   docker compose -f docker-compose.prod.yml config
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Edge: Caddy :80/:443 -> /api/* backend, /* frontend.
# Mongo/Redis/backend/frontend are private to the compose network.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGODB_DB: ${MONGODB_DB}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      MONGODB_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGODB_DB}?authSource=admin
      MONGODB_DB: ${MONGODB_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_WORKERS: ${APP_WORKERS:-2}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-demo}
      HARDWARE_OFFERS_URL: ${HARDWARE_OFFERS_URL:-}
      HARDWARE_PROVIDER_ID: ${HARDWARE_PROVIDER_ID:-hardware_feed}
      GPU_OFFERS_URL: ${GPU_OFFERS_URL:-}
      GPU_PROVIDER_ID: ${GPU_PROVIDER_ID:-gpu_feed}
      ENERGY_PRICES_URL: ${ENERGY_PRICES_URL:-}
      ENERGY_PROVIDER_ID: ${ENERGY_PROVIDER_ID:-energy_feed}
      INFRA_PROVIDER_BEARER_TOKEN: ${INFRA_PROVIDER_BEARER_TOKEN:-}
      INFRA_PROVIDER_TIMEOUT: ${INFRA_PROVIDER_TIMEOUT:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-200}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_TIMEOUT: ${AI_TIMEOUT:-20}
      AI_CACHE_TTL: ${AI_CACHE_TTL:-900}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ADVANCED: ${STRIPE_PRICE_ADVANCED:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_WHITELABEL: ${STRIPE_PRICE_WHITELABEL:-}
      STRIPE_SUCCESS_URL: https://${APP_DOMAIN}/pricing?upgraded=1
      STRIPE_CANCEL_URL: https://${APP_DOMAIN}/pricing?canceled=1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

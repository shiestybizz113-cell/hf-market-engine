name: Verify hf-market-engine

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Parse and compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Run Capital V2 integrity tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Import FastAPI application
        working-directory: backend
        env:
          ENVIRONMENT: development
          MARKET_DATA_MODE: demo
        run: python -c "from app.main import app; print(app.title, app.version)"

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  production-stack:
    name: Production stack build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config > /tmp/hf-market-engine-compose.yml
      - name: Build production images
        run: docker compose --env-file .env.example -f docker-compose.prod.yml build backend frontend

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# One run per branch/PR at a time — cancel stale runs on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Secret scan ─────────────────────────────────────────────────────────
  # Runs first and fast. Nothing else starts if secrets are detected.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for gitleaks

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest
    needs: secrets

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/

      - name: pytest
        working-directory: backend
        env:
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB: hf_test
          MARKET_DATA_MODE: demo
          SECRET_KEY: ci-test-secret-key-32chars-exactly
          ENVIRONMENT: test
          CORS_ORIGINS: http://localhost:5173
        # Coverage ratchet: the floor is the measured number at the time it was
        # last raised. Raise --cov-fail-under when coverage climbs. Never lower
        # it — a gate that gets routinely bypassed is worse than no gate.
        run: |
          pytest tests/ \
            --tb=short \
            --cov=app \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-fail-under=54.54

  # ── 3. Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    needs: secrets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: TypeScript — zero errors
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite build — must succeed
        working-directory: frontend
        run: npm run build

  # ── 4. Integration smoke ───────────────────────────────────────────────────
  # Only runs on push to main or explicit workflow_dispatch.
  # Spins up the full docker-compose stack and runs smoke-test.sh.
  integration:
    name: Integration smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          cp .env.ci .env
          docker compose up --build -d
          # Wait for backend to be healthy
          for i in {1..30}; do
            curl -sf http://localhost:8000/api/health && break || sleep 3
          done

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Tear down
        if: always()
        run: docker compose down -v
